[project]
name = "device-agent"
version = "0.1.0"
description = "设备售后协同智能体 · 统一 Python 环境（Agent 网关 + 设备中台）"
requires-python = ">=3.11,<3.13"
dependencies = [
    # ---------- Web 服务 ----------
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    # ---------- 数据校验与配置 ----------
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    # ---------- LLM 编排（OpenAI 兼容 / 通义千问）----------
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "openai>=1.54.0",
    # ---------- Prompt 模板 ----------
    "jinja2>=3.1.0",
    # ---------- 对话状态持久化 ----------
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    # ---------- 调用设备维修中台 / RAG ----------
    "httpx>=0.28.0",
    # ---------- YAML 任务流程 ----------
    "pyyaml>=6.0.2",
    "aiosqlite>=0.22.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["atgui_agent/agent_gateway"]
